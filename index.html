                        <body>
                            <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#446D74">
  <title>Researcher Connect Blog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #E6DC4A;
      --deep-teal: #446D74;
      --sand: #C4BA8B;
      --mint: #A9C9C4;
      --soft-yellow: #DDD66F;
      --gold: #C5B26C;
      --green: #82AF9E;
      --blue: #72B4C3;
      --paper: #E6E9E3;
      --ink: #273c3d;
      --muted: #526768;
      font-family: "Poppins", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }

    body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 20px 56px;
    }

    a, button, input { font: inherit; }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid #164c55;
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 10;
      padding: 10px 14px;
      transform: translateY(-150%);
      background: white;
      color: var(--ink);
      border-radius: 6px;
    }

    .skip-link:focus { transform: translateY(0); }

    header {
      padding: 28px 30px;
      margin-bottom: 24px;
      background: var(--deep-teal);
      color: white;
      border-radius: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 600;
    }

    .subtitle { margin: 6px 0 0; color: #f1f4ed; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    label { align-self: center; font-weight: 500; }

    input, button {
      min-height: 46px;
      border: 1px solid var(--sand);
      border-radius: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 0 14px;
      background: white;
      color: var(--ink);
    }

    button {
      padding: 0 18px;
      background: var(--yellow);
      color: var(--ink);
      border: 0;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--soft-yellow); }
    button:disabled { opacity: .7; cursor: wait; }

    #status { color: var(--muted); margin: 0 0 16px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 20px;
    }

    .card {
      overflow: hidden;
      background: white;
      border: 1px solid #cbd5cf;
      border-radius: 15px;
      box-shadow: 0 5px 18px #273c3d12;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 24px #273c3d20;
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: var(--mint);
    }

    .card-content { padding: 18px 19px 20px; }

    .date {
      color: var(--muted);
      font-size: .85rem;
      font-weight: 500;
    }

    .card h2 {
      margin: 8px 0 10px;
      font-size: 1.15rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .card h2 a { color: #31585e; }
    .card h2 a:hover { color: #203f44; }

    .excerpt {
      margin: 0;
      color: #394b4c;
      font-size: .95rem;
      line-height: 1.75;
    }

    .error { color: #7a2929; }

    @media (max-width: 600px) {
      body { padding: 22px 14px 40px; }
      header { padding: 23px 20px; }
      .controls { align-items: stretch; flex-direction: column; }
      label { align-self: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#posts">Skip to posts</a>

  <header>
    <h1>Researcher Connect Blog</h1>
    <p class="subtitle">Recent stories and updates from HKU</p>
  </header>

  <form class="controls" role="search" onsubmit="return false">
    <label for="search">Search posts</label>
    <input id="search" type="search" placeholder="Enter keywords">
    <button id="refresh" type="button">Refresh feed</button>
  </form>

  <p id="status" role="status" aria-live="polite" aria-atomic="true">Loading posts…</p>
  <main id="posts" class="grid" aria-label="Recent blog posts"></main>

  <script>
    const RSS_URL = "https://blog-sc.hku.hk/feed/";
    const API_URL = "https://api.rss2json.com/v1/api.json?rss_url=" +
      encodeURIComponent(RSS_URL);

    const postsEl = document.querySelector("#posts");
    const statusEl = document.querySelector("#status");
    const searchEl = document.querySelector("#search");
    const refreshBtn = document.querySelector("#refresh");
    let posts = [];

    function plainText(html = "") {
      const doc = new DOMParser().parseFromString(html, "text/html");
      return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    }

    function firstWords(text, count = 100) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      return words.slice(0, count).join(" ") +
        (words.length > count ? "…" : "");
    }

    function getImage(item) {
      const html = item.content || item.description || "";
      const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
      return item.thumbnail || item.enclosure?.link || match?.[1] || "";
    }

    function formatDate(date) {
      if (!date) return "";
      const parsed = new Date(date);
      return Number.isNaN(parsed.getTime())
        ? ""
        : parsed.toLocaleDateString(undefined, {
            year: "numeric", month: "long", day: "numeric"
          });
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = posts.filter(post =>
        `${post.title} ${post.excerpt}`.toLowerCase().includes(query)
      );

      postsEl.replaceChildren();

      if (!visible.length) {
        statusEl.textContent = posts.length
          ? "No matching posts."
          : "No posts are available.";
        return;
      }

      statusEl.textContent =
        `Showing ${visible.length} of ${posts.length} recent posts.`;

      for (const post of visible) {
        const card = document.createElement("article");
        card.className = "card";

        if (post.image) {
          const img = document.createElement("img");
          img.src = post.image;
          img.alt = post.imageAlt || `Featured image for ${post.title}`;
          img.loading = "lazy";
          img.onerror = () => img.remove();
          card.append(img);
        }

        const content = document.createElement("div");
        content.className = "card-content";

        if (post.date) {
          const date = document.createElement("time");
          date.className = "date";
          date.dateTime = post.isoDate || "";
          date.textContent = post.date;
          content.append(date);
        }

        const heading = document.createElement("h2");
        const link = document.createElement("a");
        link.href = post.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = post.title;
        link.setAttribute("aria-label", `${post.title} (opens in a new tab)`);
        heading.append(link);

        const excerpt = document.createElement("p");
        excerpt.className = "excerpt";
        excerpt.textContent = post.excerpt;

        content.append(heading, excerpt);
        card.append(content);
        postsEl.append(card);
      }
    }

    async function loadPosts() {
      refreshBtn.disabled = true;
      statusEl.classList.remove("error");
      statusEl.textContent = "Loading posts…";

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Could not reach the RSS service.");

        const data = await response.json();
        if (data.status !== "ok") {
          throw new Error(data.message || "Feed unavailable.");
        }

        posts = (data.items || []).slice(0, 8).map(item => ({
          title: plainText(item.title) || "Untitled post",
          link: item.link || RSS_URL,
          date: formatDate(item.pubDate),
          isoDate: item.pubDate && !Number.isNaN(Date.parse(item.pubDate))
            ? new Date(item.pubDate).toISOString()
            : "",
          image: getImage(item),
          imageAlt: plainText(item.title)
            ? `Featured image for ${plainText(item.title)}`
            : "Blog post featured image",
          excerpt: firstWords(
            plainText(item.content || item.description || "")
          )
        }));

        render();
      } catch (error) {
        posts = [];
        postsEl.replaceChildren();
        statusEl.classList.add("error");
        statusEl.textContent =
          `Couldn't load the feed. ${error.message} Check your connection and try again.`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    searchEl.addEventListener("input", render);
    refreshBtn.addEventListener("click", loadPosts);
    loadPosts();
  </script>
</body>
</html>

                        </html>
